name: Build OCB+OCA images

# Triggers:
#   - push to main: publish the image immediately after a builder change
#   - workflow_dispatch: manual run
#   - schedule: every Sunday at 03:00 UTC
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Generate matrix
        id: gen
        run: |
          MATRIX=$(python scripts/generate_matrix.py)
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: [discover]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Free disk space
        run: |
          echo "=== before ==="
          df -h /
          docker system prune --all --force --volumes
          echo "=== after ==="
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install script deps
        run: pip install --quiet pyyaml requests

      - name: Generate gitaggregator manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ODOO_VERSION: ${{ matrix.odoo_version }}
        run: |
          set -euo pipefail
          mkdir -p aggregations
          PROF_ARG=""
          [ -n "${{ matrix.profile }}" ] && PROF_ARG="--profile ${{ matrix.profile }}"
          BASE_ORGS_ARG=""
          [ -n "${{ matrix.base_orgs }}" ] && BASE_ORGS_ARG="--base-orgs ${{ matrix.base_orgs }}"
          TOPIC_DEV_ARG=""
          TOPIC_PROD_ARG=""
          [ -n "${{ matrix.topic_dev }}" ] && TOPIC_DEV_ARG="--topic-dev ${{ matrix.topic_dev }}"
          [ -n "${{ matrix.topic_prod }}" ] && TOPIC_PROD_ARG="--topic-prod ${{ matrix.topic_prod }}"
          python scripts/generate-oca-gitaggregator-yaml.py \
            --source-mode github \
            --org "${{ matrix.org }}" \
            ${PROF_ARG} \
            ${BASE_ORGS_ARG} \
            ${TOPIC_DEV_ARG} \
            ${TOPIC_PROD_ARG} \
            --odoo-version "${ODOO_VERSION}" \
            --page-delay-seconds 2 \
            --output "aggregations/${{ matrix.name }}.yml" \
            || { \
                 echo "API discovery failed — selecting fallback manifest"; \
                 FALLBACK=""; \
                 if [ -n "${{ matrix.profile }}" ]; then \
                   if [ -f "scripts/${{ matrix.org }}-${{ matrix.profile }}.yaml" ]; then \
                     FALLBACK="scripts/${{ matrix.org }}-${{ matrix.profile }}.yaml"; \
                   fi; \
                 fi; \
                 if [ -z "$FALLBACK" ] && [ -f "scripts/${{ matrix.org }}.yaml" ]; then \
                   FALLBACK="scripts/${{ matrix.org }}.yaml"; \
                 fi; \
                 if [ -z "$FALLBACK" ]; then \
                   FALLBACK="scripts/oca.yaml"; \
                 fi; \
                 echo "Using fallback manifest: $FALLBACK"; \
                 cp "$FALLBACK" "aggregations/${{ matrix.name }}.yml"; \
               }

      - name: Clone OCA / org addons
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ODOO_VERSION: ${{ matrix.odoo_version }}
        run: |
          set -euo pipefail
          mkdir -p src
          REPOS_YAML_FILE="aggregations/${{ matrix.name }}.yml" \
          OUT_DIR=src \
          ODOO_VERSION="${ODOO_VERSION}" \
          bash scripts/clone-repos-from-yaml.sh

      - name: Clone OCB
        env:
          ODOO_VERSION: ${{ matrix.odoo_version }}
        run: |
          git clone \
            --depth 1 \
            --filter=blob:none \
            --branch "${ODOO_VERSION}" \
            https://github.com/OCA/OCB.git \
            ocb

      - name: Aggregate requirements
        env:
          ODOO_VERSION: ${{ matrix.odoo_version }}
        run: python scripts/aggregate_requirements.py

      - name: Disk usage before build
        run: df -h && du -sh ocb/ src/ 2>/dev/null || true

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: |
          NS="${{ github.repository_owner }}"
          NS="${NS,,}"
          ODOO_VERSION="${{ matrix.odoo_version }}"
          ODOO_TAG="${ODOO_VERSION%.0}"
          PROFILE="${{ matrix.profile }}"
          IMAGE="ghcr.io/${NS}/odoo-ocb:${ODOO_TAG}"
          [ -n "${PROFILE}" ] && IMAGE="${IMAGE}-${PROFILE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: dockerfiles/odoo-ocb-oca/Dockerfile
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          push: true
          build-args: |
            PYTHON_VERSION=${{ matrix.python_version }}
            ODOO_VERSION=${{ matrix.odoo_version }}
            REPO_MANIFEST=aggregations/${{ matrix.name }}.yml
          tags: ${{ steps.tag.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}

      # Report-only by design (fail-build: false): these are upstream base
      # images (OCB + third-party OCA addons) — most CVEs surfaced here are
      # in system packages/Python deps we don't control and often can't fix
      # by ourselves, so failing the build on them would just block every
      # weekly run. Findings land in the repo's Security tab (SARIF) instead
      # of blocking — visibility now, not enforcement. Re-pulls the image
      # that was just pushed (registry creds already loaded by the login
      # step above); if disk pressure ever becomes a problem here, the
      # "Free disk space" step at job start is the first thing to widen.
      - name: Generate SBOM
        # Reporting only: a Syft/GitHub download or registry inspection error
        # must not turn a successfully pushed image into a failed build.
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.tag.outputs.image }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.name }}.spdx.json

      - name: Scan image for known CVEs
        id: scan
        # Reporting only: keep publishing even if Anchore cannot inspect the
        # image or produce SARIF for a transient/tooling failure.
        continue-on-error: true
        uses: anchore/scan-action@v7
        with:
          image: ${{ steps.tag.outputs.image }}
          fail-build: false
          severity-cutoff: medium
          output-format: sarif

      - name: Upload CVE scan results to code scanning
        if: always() && steps.scan.outputs.sarif != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: image-scan-${{ matrix.name }}

      - name: Cleanup sources and Docker layers
        if: always()
        run: |
          rm -rf ocb/ src/ aggregations/ requirements/
          docker system prune --all --force --volumes
          df -h

  # Run cleanup once, after the whole matrix has published its tags. Running
  # it inside each parallel build races with the other pushes and can delete
  # a manifest which is still being attached to its stable tag.
  cleanup-untagged:
    needs: [build]
    # Disabled until the GHCR manifest cleanup is made tag-safe.  The
    # delete-package-versions action has invalidated the stable :14 manifest
    # in production, leaving the registry tag unusable after a green build.
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: odoo-ocb
          package-type: container
          min-versions-to-keep: 1
          delete-only-untagged-versions: true
